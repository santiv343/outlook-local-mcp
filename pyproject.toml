[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "outlook-local-mcp"
version = "0.1.0"
description = "Read-only MCP server for local classic Outlook on Windows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "santiv343"}]
keywords = ["mcp", "outlook", "windows", "email"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
dependencies = ["mcp>=2.2,<3", "pywin32>=311; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/santiv343/outlook-local-mcp"
Issues = "https://github.com/santiv343/outlook-local-mcp/issues"

[project.scripts]
outlook-local-mcp = "outlook_local_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_local_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/SECURITY.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pythoncom", "pywintypes", "win32api", "win32con", "win32timezone", "win32com.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

